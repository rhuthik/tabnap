<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>tabnap</title>
<style>
  :root { --bg:#f6f6f8; --row:#ffffff; --line:#e3e3e8; --text:#1d1d1f; --muted:#7c7c84; --purple:#7d6fd0;
          --orange:#d97757; --teal:#3a9e8f; --green:#34c759; --off:#c7c7cc; --hover:#ececf1; --err:#d64545; --amber:#f5a524; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1a1c; --row:#1f1f21; --line:#2c2c2e; --text:#e5e5ea; --muted:#8e8e93; --purple:#a89de0;
            --teal:#5cc4b4; --off:#48484a; --hover:#29292c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:9px 10px 8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:1; }
  header .sum { color:var(--muted); font-size:11px; margin-top:2px; }
  header .auto { display:flex; align-items:center; justify-content:space-between; margin-top:7px; font-size:11px; }
  .row { display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:var(--hover); }
  .row.cur { box-shadow:inset 3px 0 0 var(--green); }
  .ico { width:24px; height:24px; flex:none; position:relative; display:grid; place-items:center; }
  .grow { flex:1; min-width:0; }
  .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11.5px; }
  .m { color:var(--muted); font-size:10.5px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .asleep .t { color:var(--purple); }
  .working .m { color:var(--orange); }
  .badge { display:block; }
  .sw { width:30px; height:17px; border-radius:9px; background:var(--off); position:relative; flex:none; border:0; padding:0; cursor:pointer; transition:background .2s; }
  .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .2s; }
  .sw.on { background:var(--green); } .sw.on::after { left:15px; }
  .sw:disabled { opacity:.4; cursor:default; }
  .btns { display:flex; align-items:center; gap:8px; flex:none; }
  .say { font-size:10.5px; line-height:1.35; margin-top:3px; color:var(--muted); display:-webkit-box; min-height:2.7em;
         -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .say b { font-weight:600; color:var(--text); opacity:.7; }
  .row.needs { animation:needs 1.6s ease-in-out infinite; }
  @keyframes needs { 50% { background:rgba(245,165,36,.18); } }
  .needs .m { color:var(--amber); }
  .ib { width:18px; height:18px; flex:none; border:0; background:none; padding:0; cursor:pointer; opacity:.35; color:var(--text); }
  .ib:hover { opacity:.8; }
  .ib.on, .ib.hot { opacity:1; color:var(--orange); }
  .ib:disabled { visibility:hidden; }
  .bloat { color:var(--orange); }
  .hop { animation:hop .7s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
  .wait { animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35 } }
  .zf { position:absolute; font:700 8px -apple-system, sans-serif; color:var(--purple); opacity:0; animation:zf 3s ease-in infinite; }
  .zf.b { animation-delay:1s; font-size:7px; } .zf.c { animation-delay:2s; font-size:6px; }
  @keyframes zf { 0% { transform:translate(5px,1px); opacity:0 } 25% { opacity:1 } 100% { transform:translate(12px,-12px); opacity:0 } }
  .waking { animation:pulse .8s ease-in-out infinite; }
  #toast { position:fixed; left:8px; right:8px; bottom:8px; background:var(--err); color:#fff; padding:7px 9px; border-radius:6px; font-size:11px; display:none; }
  .empty { padding:14px 10px; color:var(--muted); }
</style></head>
<body>
<header>
  <div><b>tabnap</b></div>
  <div class="sum" id="sum">loading…</div>
  <div class="auto"><span id="autolabel">Auto-hibernate</span><button class="sw" id="auto" title="Auto-hibernate idle sessions"></button></div>
</header>
<div id="list"></div>
<div id="toast"></div>
<script>
const T = "__TOKEN__";
const LABEL = {claude: "Claude", codex: "Codex"};
const TILE = (color, inner) => `<svg class="badge" width="18" height="18" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" style="fill:${color}"/>${inner}</svg>`;
const BADGE = {
  claude: TILE("var(--orange)", '<g stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13M7.4 7.4l9.2 9.2M16.6 7.4l-9.2 9.2"/></g>'),
  codex: TILE("var(--teal)", '<g stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M7 8.5l3.5 3.5L7 15.5"/><path d="M12.5 16h4.5"/></g>'),
};
const MOON = '<svg width="17" height="17" viewBox="0 0 20 20"><path d="M13.5 15.5A7 7 0 0 1 8.2 3.1a7.5 7.5 0 1 0 8.6 10.2 7 7 0 0 1-3.3 2.2z" fill="currentColor"/></svg>';
const PIN = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M9.8 1.5l4.7 4.7-1.6.4-2.6 2.6.3 3.3-1.4 1.4-2.6-2.6L3 15l-.9-.9 3.7-3.6-2.6-2.6 1.4-1.4 3.3.3 2.6-2.6z" fill="currentColor"/></svg>';
const RF = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M13.6 2.4v4.2H9.4l1.6-1.6A4.5 4.5 0 1 0 12.4 9h1.6A6 6 0 1 1 12.1 3.9z" fill="currentColor"/></svg>';
const rows = new Map();
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function mins(m) { m = Math.max(0, Math.round(m||0)); if (m < 60) return m + "m"; if (m < 2880) return Math.floor(m/60) + "h" + (m%60 ? String(m%60).padStart(2,"0") + "m" : ""); return Math.floor(m/1440) + "d"; }
function gb(mb) { return mb >= 1024 ? (mb/1024).toFixed(1) + " GB" : Math.round(mb) + " MB"; }
function ctxLine(r) {
  const c = r.context || {};
  if (!c.prompt && !c.answer) return "";
  // Both lines always present at a fixed height, so a reply arriving mid-turn doesn't shift the list.
  return `<div class="say" title="${esc(c.prompt || "")}"><b>You</b> ${esc(c.prompt || "…")}</div>` +
         `<div class="say" title="${esc(c.answer || "")}"><b>${LABEL[r.agent] || "Agent"}</b> ${esc(c.answer || "…")}</div>`;
}
async function post(path, params) {
  const q = new URLSearchParams({t: T, ...params});
  const r = await fetch(path + "?" + q, {method: "POST"});
  if (!r.ok) { const e = await r.json().catch(() => ({})); toast(e.error || ("HTTP " + r.status)); }
  refresh();
}
let toastTimer;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = "none", 4000); }
function meta(r) {
  if (r.needs === "done") return `finished · needs you · ${r.mem_mb} MB`;
  if (r.state === "hibernated") return `hibernated ${mins(r.asleep_min)} · ${r.freed_mb} MB freed`;
  if (r.state === "waking") return "waking…";
  if (r.state === "working") return (r.detail ? esc(r.detail) + " · " : "working · ") + r.mem_mb + " MB";
  if (r.state === "waiting") return (r.detail ? esc(r.detail) + " · " : "waiting for you · ") + r.mem_mb + " MB";
  let s = `idle ${mins(r.idle_min)} · ` + (r.bloated ? `<span class="bloat">${gb(r.mem_mb)} · refresh?</span>` : `${r.mem_mb} MB`);
  if (r.pinned) s += " · kept awake";
  else if (r.sleeps_in != null) s += ` · sleeps in ${mins(r.sleeps_in)}`;
  else if (r.blocker && r.blocker !== "tab in focus") s += ` · ${esc(r.blocker)}`;
  return s;
}
function icon(r) {
  if (r.state === "hibernated") return `<span style="color:var(--purple)">${MOON}</span><span class="zf">z</span><span class="zf b">z</span><span class="zf c">z</span>`;
  if (r.state === "waking") return `<span class="waking" style="color:var(--purple)">${MOON}</span>`;
  const b = BADGE[r.agent] || BADGE.claude;
  if (r.state === "working") return `<span class="hop">${b}</span>`;
  if (r.state === "waiting") return `<span class="wait">${b}</span>`;
  return b;
}
function parts(r) {
  const asleep = r.state === "hibernated" || r.state === "waking";
  const busy = r.state === "working" || r.state === "waiting" || r.state === "waking";
  return {
    cls: ["row", asleep ? "asleep" : "", r.state, r.current ? "cur" : "", r.needs ? "needs" : ""].join(" "),
    ico: icon(r),
    grow: `<div class="t">${esc(r.title)}</div><div class="m">${meta(r)}</div>${ctxLine(r)}`,
    btns: `<button class="ib ${r.bloated ? "hot" : ""}" data-rf="${esc(r.id)}" ${r.state === "idle" ? "" : "disabled"} title="Refresh: restart with the same conversation (frees leaked memory)">${RF}</button>` +
          `<button class="ib ${r.pinned ? "on" : ""}" data-pin="${esc(r.id)}" title="${r.pinned ? "Kept awake (click to allow auto-hibernate)" : "Keep awake"}">${PIN}</button>` +
          `<button class="sw ${asleep ? "" : "on"}" data-sw="${esc(r.id)}" ${busy ? "disabled" : ""} title="${asleep ? "Wake" : "Hibernate"}"></button>`,
  };
}
function render(st) {
  document.getElementById("sum").textContent = `${st.awake} awake · ${st.asleep} asleep · ${gb(st.in_use_mb)} in use · ${gb(st.freed_mb)} freed`;
  document.getElementById("auto").classList.toggle("on", st.auto);
  document.getElementById("autolabel").textContent = `Auto-hibernate after ${st.idle_minutes} min idle`;
  const list = document.getElementById("list");
  if (!st.sessions.length) { list.innerHTML = '<div class="empty">No Claude Code or Codex sessions found.</div>'; rows.clear(); return; }
  list.querySelector(".empty")?.remove();
  const ids = new Set(st.sessions.map(r => r.id));
  for (const [id, item] of rows) if (!ids.has(id)) { item.el.remove(); rows.delete(id); }
  let prev = null;
  for (const r of st.sessions) {
    const p = parts(r);
    let item = rows.get(r.id);
    if (!item) {
      const el = document.createElement("div");
      el.dataset.id = r.id;
      el.innerHTML = '<div class="ico"></div><div class="grow"></div><div class="btns"></div>';
      item = {el, p: {}};
      rows.set(r.id, item);
    }
    // Touch only what changed: rewriting a row restarts its CSS animations, which reads as flicker.
    if (item.p.cls !== p.cls) item.el.className = p.cls;
    for (const k of ["ico", "grow", "btns"]) if (item.p[k] !== p[k]) item.el.querySelector("." + k).innerHTML = p[k];
    item.p = p;
    const want = prev ? prev.nextSibling : list.firstChild;
    if (want !== item.el) list.insertBefore(item.el, want);
    prev = item.el;
  }
}
async function refresh() {
  try {
    const r = await fetch("/api/state?t=" + T, {cache: "no-store"});
    if (r.ok) render(await r.json());
  } catch (e) { document.getElementById("sum").textContent = "daemon not reachable"; }
}
document.addEventListener("click", e => {
  const sw = e.target.closest("[data-sw]"), pin = e.target.closest("[data-pin]"), rf = e.target.closest("[data-rf]");
  const row = e.target.closest(".row");
  if (rf) { e.stopPropagation(); return post("/api/refresh", {id: rf.dataset.rf}); }
  if (e.target.closest("#auto")) return post("/api/auto", {on: document.getElementById("auto").classList.contains("on") ? "0" : "1"});
  if (sw) { e.stopPropagation(); return post("/api/toggle", {id: sw.dataset.sw}); }
  if (pin) { e.stopPropagation(); return post(pin.classList.contains("on") ? "/api/unpin" : "/api/pin", {id: pin.dataset.pin}); }
  if (row) return post("/api/focus", {id: row.dataset.id});
});
refresh(); setInterval(refresh, 1500);
</script>
</body></html>
