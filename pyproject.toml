[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tabnap"
version = "0.1.0"
description = "Hibernate idle Claude Code and Codex sessions in your terminal tabs to free memory, and wake them in place."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rhuthik" }]
keywords = ["claude-code", "codex", "iterm2", "tmux", "memory", "hibernate", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Terminals",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
iterm = ["iterm2>=2.7"]

[project.urls]
Homepage = "https://github.com/rhuthik/tabnap"
Issues = "https://github.com/rhuthik/tabnap/issues"

[project.scripts]
tabnap = "tabnap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tabnap"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
